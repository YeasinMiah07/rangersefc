<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Rangers Efootball Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--royal:#0B1D3A;--royal2:#122a52;--black:#111111;--cyan:#00D4FF;--gold:#F5A623;--white:#eef3fb;--gray:#8a94a8;--line:rgba(255,255,255,0.08);--win:#2ecc71;--loss:#ff5c5c;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(160deg,#060a12,#0B1D3A);color:var(--white);font-family:'Poppins',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.wrap{max-width:400px;width:100%;}
.crest{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--royal2),var(--black));border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;object-fit:contain;background-size:cover;font-family:'Orbitron';font-weight:900;font-size:16px;color:var(--cyan);margin:0 auto 16px;}
h2{font-family:'Orbitron';text-align:center;font-size:20px;margin-bottom:6px;}
.sub{text-align:center;font-family:'Rajdhani';color:var(--gray);font-size:13px;margin-bottom:24px;}
.card{background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:14px;padding:26px;}
label{display:block;font-family:'Rajdhani';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:6px;padding:11px 12px;color:var(--white);font-family:'Rajdhani';font-size:14px;margin-bottom:14px;}
input:focus{outline:none;border-color:var(--cyan);}
.btn{width:100%;background:var(--cyan);color:var(--black);border:none;padding:13px;border-radius:6px;font-family:'Rajdhani';font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;cursor:pointer;}
.btn:hover{background:var(--gold);}
.msg{margin-top:14px;font-family:'Rajdhani';font-size:13px;padding:10px 12px;border-radius:6px;display:none;}
.msg.show{display:block;}
.msg.err{background:rgba(255,92,92,0.1);border:1px solid rgba(255,92,92,0.3);color:var(--loss);}
.msg.ok{background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.3);color:var(--win);}
a{color:var(--cyan);}
</style>
</head>
<body>
<div class="wrap">
  <img src="logo.jpg" alt="Rangers EFC" class="crest">
  <h2>Set a New Password</h2>
  <p class="sub">Enter a new password for your Rangers EFC account.</p>
  <div class="card">
    <label>New Password</label>
    <input type="password" id="newPw" placeholder="At least 6 characters">
    <label>Confirm Password</label>
    <input type="password" id="confirmPw" placeholder="Repeat password">
    <button class="btn" onclick="handleReset()">Update Password</button>
    <div class="msg" id="resetMsg"></div>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
async function handleReset(){
  const pw = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  const msgEl = document.getElementById('resetMsg');
  if(pw.length < 6){ showMsg('Password needs at least 6 characters.', true); return; }
  if(pw !== confirm){ showMsg('Passwords do not match.', true); return; }
  const res = await setNewPassword(pw);
  if(!res.ok){ showMsg(res.error, true); return; }
  showMsg('Password updated! Redirecting to sign in...', false);
  setTimeout(()=> window.location.href = 'auth.html', 1800);
}
function showMsg(text, isError){
  const el = document.getElementById('resetMsg');
  el.textContent = text;
  el.className = 'msg show ' + (isError ? 'err' : 'ok');
}
</script>
</body>
</html>
