<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP Voting | Rangers Efootball Club</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--royal:#0B1D3A;--royal2:#122a52;--black:#111111;--deep:#0a0f1c;--cyan:#00D4FF;--gold:#F5A623;--white:#eef3fb;--gray:#8a94a8;--line:rgba(255,255,255,0.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--deep);color:var(--white);font-family:'Poppins',sans-serif;font-weight:300;}
h1,h2,h3{font-family:'Orbitron',sans-serif;}
.container{max-width:800px;margin:0 auto;padding:40px;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:72px;background:rgba(10,15,28,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
.crest{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,var(--royal2),var(--black));border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;object-fit:contain;background-size:cover;font-family:'Orbitron';font-weight:900;font-size:13px;color:var(--cyan);}
.brand-text .name{font-family:'Orbitron';font-weight:700;font-size:15px;}
.brand-text .sub{font-family:'Rajdhani';font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.back-link{font-family:'Rajdhani';font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);text-decoration:none;}
.eyebrow{font-family:'Rajdhani';font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);font-size:12px;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.eyebrow::before{content:'';width:28px;height:2px;background:var(--gold);}
.page-title{font-size:clamp(28px,4vw,42px);font-weight:900;margin-bottom:10px;}
.page-desc{color:var(--gray);font-size:14px;line-height:1.7;margin-bottom:32px;}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:32px;}
.vcard{background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:.2s;}
.vcard:hover{border-color:rgba(0,212,255,0.4);}
.vcard.voted{border-color:var(--gold);background:rgba(245,166,35,0.06);}
.v-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--royal2),var(--black));border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:'Orbitron';font-weight:700;font-size:15px;color:var(--cyan);}
.v-name{font-family:'Rajdhani';font-weight:700;font-size:14px;margin-bottom:10px;}
.bar-track{background:rgba(255,255,255,0.06);border-radius:100px;height:8px;overflow:hidden;margin-bottom:6px;}
.bar-fill{background:linear-gradient(90deg,var(--cyan),var(--gold));height:100%;border-radius:100px;transition:width .4s;}
.v-pct{font-family:'Rajdhani';font-size:11px;color:var(--gray);}
.status{text-align:center;font-family:'Rajdhani';color:var(--gold);font-size:13px;margin-top:8px;}

.nav-toggle{display:none;background:transparent;border:1px solid var(--line);color:var(--white);width:40px;height:40px;border-radius:5px;font-size:18px;cursor:pointer;}
.navlinks{display:flex;gap:22px;list-style:none;align-items:center;}
.navlinks a{font-family:'Rajdhani';font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:.2s;}
.navlinks a:hover{color:var(--cyan);}
.navlinks a.active{color:var(--cyan);}
.navlinks .cta{background:var(--cyan);color:var(--black)!important;padding:8px 16px;border-radius:3px;font-weight:700!important;}
.navlinks .admin-link{border:1px solid var(--gold);color:var(--gold)!important;padding:7px 14px;border-radius:3px;font-weight:700!important;}
@media(max-width:900px){
  .nav-toggle{display:block;}
  .navlinks{display:none;position:absolute;top:72px;left:0;right:0;background:#0a0f1c;flex-direction:column;padding:14px 24px 20px;border-bottom:1px solid var(--line);gap:2px;box-shadow:0 20px 40px rgba(0,0,0,0.4);}
  .navlinks.open{display:flex;}
  .navlinks li{width:100%;}
  .navlinks a{display:block;width:100%;padding:13px 8px;}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="brand"><img src="logo.jpg" alt="Rangers EFC" class="crest"><div class="brand-text"><div class="name">RANGERS</div><div class="sub">MVP Voting</div></div></a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <ul class="navlinks" id="navLinks">
    <li><a href="index.html" data-page="home">Home</a></li>
    <li><a href="players.html" data-page="players">Roster</a></li>
    <li><a href="tournament-live.html" data-page="live">🔴 Live Tournament</a></li>
    <li><a href="rules.html" data-page="rules">Rules</a></li>
    <li><a href="news.html" data-page="news">News</a></li>
    <li><a href="mvp-vote.html" data-page="mvp" class="active">MVP Vote</a></li>
    <li><a href="index.html#join" class="cta">Join Us</a></li>
    <li><a href="auth.html" style="border:1px solid var(--line);padding:7px 14px;border-radius:3px;">Sign In</a></li>
    <li><a href="tournament-hub.html" class="admin-link">🔒 Admin</a></li>
  </ul>
</nav>

<div class="container">
  <div class="eyebrow">Player of the Match</div>
  <h1 class="page-title">Vote for the Tournament MVP</h1>
  <p class="page-desc">Cast your vote for this round's standout Ranger. One vote per session — results update live below.</p>

  <div class="vote-grid" id="voteGrid"></div>
  <p class="status" id="voteStatus"></p>
</div>

<script>
const candidates = [
  {name:"RFC Captain", votes:14},
  {name:"Striker Alpha", votes:22},
  {name:"Wing King", votes:9},
  {name:"Wall Keeper", votes:17},
  {name:"Box Maestro", votes:6},
];
let hasVoted = false;

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2);}
function totalVotes(){return candidates.reduce((s,c)=>s+c.votes,0);}

function render(){
  const total = totalVotes();
  document.getElementById('voteGrid').innerHTML = candidates.map((c,i)=>{
    const pct = total ? Math.round(c.votes/total*100) : 0;
    return `<div class="vcard" onclick="vote(${i})">
      <div class="v-avatar">${initials(c.name)}</div>
      <div class="v-name">${c.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="v-pct">${c.votes} votes · ${pct}%</div>
    </div>`;
  }).join('');
}
render();

function vote(i){
  if(hasVoted){ document.getElementById('voteStatus').textContent = "You've already voted this session."; return; }
  candidates[i].votes++;
  hasVoted = true;
  render();
  document.getElementById('voteStatus').textContent = `Thanks for voting for ${candidates[i].name}!`;
}
</script>

<script>
const navToggle = document.getElementById('navToggle');
const navLinks = document.getElementById('navLinks');
navToggle.addEventListener('click', ()=> navLinks.classList.toggle('open'));
navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=> navLinks.classList.remove('open')));
</script>
</body>
</html>
