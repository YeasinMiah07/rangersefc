<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club News | Rangers Efootball Club</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--royal:#0B1D3A;--royal2:#122a52;--black:#111111;--deep:#0a0f1c;--cyan:#00D4FF;--gold:#F5A623;--white:#eef3fb;--gray:#8a94a8;--line:rgba(255,255,255,0.08);--loss:#ff5c5c;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--deep);color:var(--white);font-family:'Poppins',sans-serif;font-weight:300;}
h1,h2,h3,h4{font-family:'Orbitron',sans-serif;}
.container{max-width:1000px;margin:0 auto;padding:40px;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:72px;background:rgba(10,15,28,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
.crest{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,var(--royal2),var(--black));border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;object-fit:contain;background-size:cover;font-family:'Orbitron';font-weight:900;font-size:13px;color:var(--cyan);}
.brand-text .name{font-family:'Orbitron';font-weight:700;font-size:15px;}
.brand-text .sub{font-family:'Rajdhani';font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.back-link{font-family:'Rajdhani';font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);text-decoration:none;}
.back-link:hover{color:var(--cyan);}
.eyebrow{font-family:'Rajdhani';font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);font-size:12px;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.eyebrow::before{content:'';width:28px;height:2px;background:var(--gold);}
.page-title{font-size:clamp(30px,4vw,46px);font-weight:900;margin-bottom:10px;}
.page-desc{color:var(--gray);font-size:14px;max-width:640px;line-height:1.7;margin-bottom:24px;}
.btn{font-family:'Rajdhani';font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;padding:11px 24px;border:none;border-radius:5px;cursor:pointer;background:var(--gold);color:#111;margin-bottom:32px;}
.composer{display:none;background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:32px;}
.composer input,.composer select,.composer textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:5px;padding:10px 12px;color:var(--white);font-family:'Rajdhani';font-size:14px;margin-bottom:12px;}
.composer textarea{min-height:100px;resize:vertical;}
.post-card{background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:10px;padding:26px;margin-bottom:18px;}
.post-cat{font-family:'Rajdhani';font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.post-title{font-family:'Rajdhani';font-weight:700;font-size:19px;margin-bottom:6px;}
.post-date{font-family:'Rajdhani';font-size:12px;color:var(--gray);margin-bottom:14px;}
.post-body{font-size:14px;color:rgba(238,243,251,0.65);line-height:1.7;}
.lockbox{display:flex;gap:8px;align-items:center;margin-bottom:32px;}
.lockbox input{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:5px;padding:9px 12px;color:var(--white);font-family:'Rajdhani';font-size:13px;}

.nav-toggle{display:none;background:transparent;border:1px solid var(--line);color:var(--white);width:40px;height:40px;border-radius:5px;font-size:18px;cursor:pointer;}
.navlinks{display:flex;gap:22px;list-style:none;align-items:center;}
.navlinks a{font-family:'Rajdhani';font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:.2s;}
.navlinks a:hover{color:var(--cyan);}
.navlinks a.active{color:var(--cyan);}
.navlinks .cta{background:var(--cyan);color:var(--black)!important;padding:8px 16px;border-radius:3px;font-weight:700!important;}
.navlinks .admin-link{border:1px solid var(--gold);color:var(--gold)!important;padding:7px 14px;border-radius:3px;font-weight:700!important;}
@media(max-width:900px){
  .nav-toggle{display:block;}
  .navlinks{display:none;position:absolute;top:72px;left:0;right:0;background:#0a0f1c;flex-direction:column;padding:14px 24px 20px;border-bottom:1px solid var(--line);gap:2px;box-shadow:0 20px 40px rgba(0,0,0,0.4);}
  .navlinks.open{display:flex;}
  .navlinks li{width:100%;}
  .navlinks a{display:block;width:100%;padding:13px 8px;}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="brand"><img src="logo.jpg" alt="Rangers EFC" class="crest"><div class="brand-text"><div class="name">RANGERS</div><div class="sub">Club News</div></div></a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <ul class="navlinks" id="navLinks">
    <li><a href="index.html" data-page="home">Home</a></li>
    <li><a href="players.html" data-page="players">Roster</a></li>
    <li><a href="tournament-live.html" data-page="live">🔴 Live Tournament</a></li>
    <li><a href="rules.html" data-page="rules">Rules</a></li>
    <li><a href="news.html" data-page="news" class="active">News</a></li>
    <li><a href="mvp-vote.html" data-page="mvp">MVP Vote</a></li>
    <li><a href="index.html#join" class="cta">Join Us</a></li>
    <li><a href="auth.html" style="border:1px solid var(--line);padding:7px 14px;border-radius:3px;">Sign In</a></li>
    <li><a href="tournament-hub.html" class="admin-link">🔒 Admin</a></li>
  </ul>
</nav>

<div class="container">
  <div class="eyebrow">Club News</div>
  <h1 class="page-title">Latest Updates</h1>
  <p class="page-desc">Announcements, match reports, and tournament recaps from Rangers EFC.</p>

  <button class="btn" onclick="openComposer()">✎ Admin: New Post</button>

  <div class="composer" id="composer">
    <div class="lockbox" id="lockbox">
      <input type="password" id="lockInput" placeholder="Admin access code">
      <button class="btn" style="margin:0;" onclick="checkCode()">Unlock</button>
    </div>
    <div id="composerFields" style="display:none;">
      <input id="pTitle" placeholder="Post title">
      <select id="pCat"><option>Tournament</option><option>Club Match</option><option>Recruitment</option><option>Announcement</option></select>
      <textarea id="pBody" placeholder="Write the update..."></textarea>
      <button class="btn" style="margin:0;" onclick="publishPost()">Publish Post</button>
    </div>
  </div>

  <div id="postList"></div>
</div>

<script>
// ⚠ Client-side lock only, session-scoped — for real security this
// check must live on a server. This just keeps casual visitors from
// posting, not a determined one.
const ADMIN_CODE = "Rangers2026";
let unlocked = false;

const posts = [
  {title:"UCL Season 2 — Registration Now Open for All Squad Members", cat:"Tournament", date:"May 20, 2026", body:"Group stage draw happens this Friday. All main squad players are eligible — sign up via the Tournament Hub before entries close."},
  {title:"Rangers 4–2 Dhaka United in COBEG League", cat:"Club Match", date:"May 18, 2026", body:"A dominant second-half performance sealed three points on the road. Striker Alpha bagged a brace."},
  {title:"Club Trials Open — 5 Spots Available for Main Squad", cat:"Recruitment", date:"May 15, 2026", body:"Rangers is scouting for 5 new main-squad players. Applications open now via the Join Us form on the main site."},
];

function renderPosts(){
  document.getElementById('postList').innerHTML = posts.map(p=>`
    <div class="post-card">
      <div class="post-cat">${p.cat}</div>
      <div class="post-title">${p.title}</div>
      <div class="post-date">${p.date}</div>
      <div class="post-body">${p.body}</div>
    </div>`).join('');
}
renderPosts();

function openComposer(){
  document.getElementById('composer').style.display = 'block';
}
function checkCode(){
  const val = document.getElementById('lockInput').value;
  if(val === ADMIN_CODE){
    unlocked = true;
    document.getElementById('lockbox').style.display = 'none';
    document.getElementById('composerFields').style.display = 'block';
  } else {
    alert('Incorrect admin code.');
  }
}
function publishPost(){
  const title = document.getElementById('pTitle').value.trim();
  const cat = document.getElementById('pCat').value;
  const body = document.getElementById('pBody').value.trim();
  if(!title || !body) return;
  posts.unshift({title, cat, date:'Just now', body});
  renderPosts();
  document.getElementById('pTitle').value='';
  document.getElementById('pBody').value='';
}
</script>

<script>
const navToggle = document.getElementById('navToggle');
const navLinks = document.getElementById('navLinks');
navToggle.addEventListener('click', ()=> navLinks.classList.toggle('open'));
navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=> navLinks.classList.remove('open')));
</script>
</body>
</html>
